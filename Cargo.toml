[package]
name = "meatpack"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Rust implementation of the MeatPack algorithm for encoding gcode."
repository = "https://github.com/jamesgopsill/meatpack"
readme = "README.md"
keywords = ["gcode", "no_std", "MEX", "FDM", "3d_printing"]
include = ["/src", "/README.md", "/LICENSE"]

[features]
default = []
std = ["embedded-io/std"]
cli = ["dep:clap", "dep:embedded-io-adapters"]
defmt = ["dep:defmt", "embedded-io/defmt"]

[[bin]]
name = "meatpack"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "pack"
required-features = ["std"]

[[example]]
name = "unpack"
required-features = ["std"]

[[example]]
name = "pack_unpack"
required-features = ["std"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
embedded-io = "0.7.1"
embedded-io-adapters = { version = "0.7", features = ["std"], optional = true }
embedded-io-async = "0.7.0"
defmt = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
embedded-io = { version = "0.7.1", features = ["std"] }
